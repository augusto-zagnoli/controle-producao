<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Funções</h1>
      <p class="page-sub">Gerencie as funções disponíveis no sistema</p>
    </div>
    <button mat-flat-button color="primary" (click)="abrirAdicionar()">
      <mat-icon>add</mat-icon> Nova Função
    </button>
  </div>

  @if (carregando) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-card">
    <table mat-table [dataSource]="itens" class="mat-elevation-z0">

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="ordem">
        <th mat-header-cell *matHeaderCellDef>Ordem</th>
        <td mat-cell *matCellDef="let row">{{ row.ordem }}</td>
      </ng-container>

      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip [class.chip-ativo]="row.ativo" [class.chip-inativo]="!row.ativo">
            {{ row.ativo ? 'Ativo' : 'Inativo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="acoes-cell">
          <button mat-icon-button matTooltip="Editar" (click)="abrirEditar(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Excluir" color="warn" (click)="excluir(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;" [class.row-inativo]="!row.ativo"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-row" [attr.colspan]="colunas.length">
          Nenhuma função cadastrada.
        </td>
      </tr>
    </table>
  </div>
</div>
