<section class="login-page">
  <div class="public-links">
    <a routerLink="/producao" class="public-link">Produção</a>
    <a routerLink="/dashboard" class="public-link">Dashboard</a>
  </div>
  <div class="login-card">
    @if (logoUrl) {
      <div class="logo-container">
        <img [src]="logoUrl" alt="Logo" class="logo">
      </div>
    }
    
    <h1>{{ nomeEmpresa }}</h1>
    <p class="subtitle">Faça login para continuar</p>
    
    <form [formGroup]="form" (ngSubmit)="entrar()" class="form">
      <label>
        Login
        <input formControlName="login" autocomplete="username" />
      </label>
      <label>
        Senha
        <input formControlName="senha" type="password" autocomplete="current-password" />
      </label>
      @if (erro) {
        <p class="erro">{{ erro }}</p>
      }
      <button type="submit" class="btn primary" [disabled]="carregando">
        {{ carregando ? 'Aguarde...' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
